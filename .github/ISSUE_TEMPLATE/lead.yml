name: Lead
description: A missing build, disc, document, person or revival sign worth following up
title: "Lead: "
labels: [lead]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Please don't attach game files. A description, a hash and a public link are enough.
        Section 6 of CONTEXT.md in the repository lists what has already been searched.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of lead?
      options:
        - Build, demo or beta
        - Magazine disc or article
        - Website, manual or lore
        - Video or screenshots
        - People or revival news
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What is it?
      description: Version, date, file names, sizes, MD5/SHA-256 if you have them.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where is it?
      description: Link, magazine issue, archive item, or "I have a copy".
    validations:
      required: true
