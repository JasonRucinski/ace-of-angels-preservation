name: Tests

# The suites that need no game files: protocol, server, relay and host checks
# against synthetic clients on loopback, and the golden snapshots of client
# patch bytes and server command lines. The other client-patch suites need the
# user's own 2.9.2 executable and run locally through tools/verify_local.py.
# Both lists are in tests/tiers.py.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Playing and hosting need no pip packages (requirements.txt lists none);
      # the tests do. Windows also installs Pillow for the texture pack builder.
      - run: python -m pip install -r requirements.txt -r requirements-research.txt -r requirements-texture.txt
        if: runner.os == 'Windows'
      - name: Install pinned analysis packages
        if: runner.os == 'Linux'
        run: python -m pip install -r requirements.txt -r requirements-research.txt
      - name: Validate Linux service definition
        if: runner.os == 'Linux'
        run: systemd-analyze verify deploy/linux/aoa-host.service
      # The suite list is tests/tiers.py (CI, plus CI_WINDOWS on Windows).
      - name: Run game-free suites
        run: python -I tools/test.py --tier ci
